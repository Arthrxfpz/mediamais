<script>

window._tch=false;

 const step=t=>{if(window._tch){st._gl=0;return}const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);st.scrollLeft=s0+d*e;if(k<1)st._gl=requestAnimationFrame(step)};st._gl=requestAnimationFrame(step)}
/* centraliza a página atual na tela (celular) */
function centerCur(ms){if(innerWidth>760||window._tch)return;const st=$('#stage'),b=document.querySelector('.pgbox.cur');if(!b)return;
 const sr=st.getBoundingClientRect(),r=b.getBoundingClientRect();glideX(st,st.scrollLeft+(r.left+r.width/2-(sr.left+sr.width/2)),ms||150)}
(()=>{const st=$('#stage');
 st.addEventListener('touchstart',()=>{window._tch=true;cancelAnimationFrame(st._gl)},{capture:true,passive:true});
 ['touchend','touchcancel'].forEach(n=>st.addEventListener(n,()=>{window._tch=false},{capture:true,passive:true}));})();
/* setas: anterior e próxima página */
let pgBusy=false;
/* troca pelas setas: a página atual sai deslizando e a nova entra pelo mesmo lado, quando ela estiver pronta */
const pgStep=d=>{const i=cur+d;if(i<0||i>=pages.length||pgBusy)return;pgBusy=true;zoom=1;
 const out=document.querySelector('.pgbox.cur'),W=Math.round($('#stage').clientWidth*.6);

  go(i);$('#stage').scrollLeft=0;pgArrows()};
 if(out&&out.animate){const a=out.animate([{transform:'translateX(0)',opacity:1},{transform:'translateX('+(-d*W)+'px)',opacity:0}],{duration:130,easing:'ease-in',fill:'forwards'});a.onfinish=enter}
 else enter()};
const pgArrows=()=>{const a=$('#prv'),b=$('#nxt'),n=$('#pgnum');if(a)a.style.opacity=cur<=0?'.35':'1';if(b)b.style.opacity=cur>=pages.length-1?'.35':'1';if(n)n.textContent=(cur+1)+' / '+pages.length};

{const _rp=renderPages;renderPages=function(){_rp.apply(this,arguments);pgArrows();if(innerWidth<=760)setTimeout(()=>centerCur(0),0);

<script>
/* =====================================================================
   OTIMIZAÇÃO v5
   - cada projeto é guardado separado (IndexedDB): metadados, páginas e imagens em registros próprios
   - cada projeto abre em sua própria aba (só o que está aberto ocupa memória)
   - imagens saem do JSON/histórico (viram referências) e são carregadas sob demanda
   - previews de páginas sob demanda, bibliotecas de PDF carregadas só quando usadas
   - fotos grandes são reduzidas ao enviar; canvases temporários são descartados
   ===================================================================== */
(()=>{
const BLANK='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const TAB=Math.random().toString(36).slice(2,10);
let BC=null;try{if('BroadcastChannel' in window)BC=new BroadcastChannel('pdfstudio-v5')}catch(e){}
const mem={proj:new Map(),page:new Map(),asset:new Map()};
let dbp=null,warned=false;
function idb(){return dbp||(dbp=new Promise(res=>{try{
  const rq=indexedDB.open('pdfstudio',1);
  rq.onupgradeneeded=()=>{const d=rq.result;['proj','page','asset'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s)})};
  rq.onsuccess=()=>{const d=rq.result;d.onversionchange=()=>{try{d.close()}catch(e){}dbp=null};res(d)};
  rq.onerror=rq.onblocked=()=>res(null);
 }catch(e){res(null)}}))}
const rq2=r=>new Promise(res=>{r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)});
const rng=pid=>IDBKeyRange.bound(pid+'/',pid+'/\uffff');
async function dget(s,k){const d=await idb();if(!d)return mem[s].get(k);try{return await rq2(d.transaction(s).objectStore(s).get(k))}catch(e){return undefined}}
async function drange(s,pid){const d=await idb();if(!d)return[...mem[s].entries()].filter(x=>x[0].startsWith(pid+'/')).map(x=>x[1]);try{return(await rq2(d.transaction(s).objectStore(s).getAll(rng(pid))))||[]}catch(e){return[]}}
async function dkeys(s,pid){const d=await idb();if(!d)return[...mem[s].keys()].filter(k=>k.startsWith(pid+'/')).map(k=>k.slice(pid.length+1));try{return((await rq2(d.transaction(s).objectStore(s).getAllKeys(rng(pid))))||[]).map(k=>String(k).slice(pid.length+1))}catch(e){return[]}}

/* ---------- estado ---------- */
const assets=new Map(),urlIds=new Map();
let aidN=0,savedAids=new Set(),stored=new Set(),blocked=false,dupPending=false;
const newAid=()=>'a'+(++aidN).toString(36)+Math.random().toString(36).slice(2,6);
const newPid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dirty=p=>{p._v=(p._v||0)+1};
const uidOf=p=>p.uid||(p.uid=Math.random().toString(36).slice(2,9)+(++aidN).toString(36));

function initSaved(id){savedAids=new Set();dkeys('asset',id).then(ks=>{if(proj.id===id)ks.forEach(k=>savedAids.add(k))})}
Object.assign(window,{dirty,resetStore,newPid,initSaved});
const hashSet=id=>{try{history.replaceState(null,'',location.href.split('#')[0]+'#p-'+id)}catch(e){}};
const announce=id=>{try{BC&&BC.postMessage({t:'has',id,tab:TAB})}catch(e){}};
const setTitle=()=>{document.title=(proj.name?proj.name+' · ':'')+'Média+ Studio'};
function setSaved(t){const s=document.querySelector('.saved');if(s&&s.lastChild&&s.lastChild.nodeType==3&&s.lastChild.nodeValue!==t)s.lastChild.nodeValue=t}

/* ---------- imagens como referências ---------- */
async function getAsset(id){const e=assets.get(id);if(e)return e.url;const u=await dget('asset',proj.id+'/'+id);if(typeof u=='string'){assets.set(id,{url:u,saved:true});urlIds.set(u,id);return u}return BLANK}
const IPr=fabric.Image.prototype,_to=IPr.toObject;
IPr.toObject=function(p){const o=_to.call(this,p);let id=this._aid;
 if(!id){const u=o.src;if(typeof u=='string'&&u.indexOf('data:')===0){id=urlIds.get(u);if(!id){id=newAid();urlIds.set(u,id);assets.set(id,{url:u,saved:false})}this._aid=id}}
 if(id)o.src='@a:'+id;return o};
const _fo2=fabric.Image.fromObject;
fabric.Image.fromObject=function(obj,cb){const s=obj&&obj.src;
 if(typeof s=='string'&&s.indexOf('@a:')===0){const id=s.slice(3),self=this;
  getAsset(id).then(url=>{_fo2.call(self,Object.assign({},obj,{src:url||BLANK}),im=>{if(im)im._aid=id;cb&&cb(im)})});return}

function trimAssets(){const cj=pages[cur]&&pages[cur].json,refs=new Set();
 if(typeof cj=='string')for(const m of cj.matchAll(/@a:([a-z0-9]+)/g))refs.add(m[1]);
 for(const [id,e] of [...assets]){if(e.saved&&!refs.has(id)){assets.delete(id);urlIds.delete(e.url)}}}

/* ---------- gravação incremental ---------- */
let pT=0,chain=Promise.resolve(),lastBC=0;
const notify=()=>{if(BC&&Date.now()-lastBC>800){lastBC=Date.now();try{BC.postMessage({t:'list'})}catch(e){}}};
async function doPersist(gc){
 if(!proj.id||blocked)return;
 const d=await idb();
 if(!proj.id||blocked)return;
 const pid=proj.id,pg=pages.slice(),order=pg.map(uidOf);
 const W=[];pg.forEach(p=>{const v=p._v||0;if(p._sv!==v)W.push([p,v])});
 const A=[];assets.forEach((e,id)=>{if(!e.saved)A.push([id,e])});
 const meta={id:pid,name:proj.name||'Sem título',tc:textColor,updated:Date.now(),order,np:pg.length,th:(pg[0]&&pg[0].th)||''};
 const del=[...stored].filter(u=>order.indexOf(u)<0);
 let gcIds=[];
 if(gc&&savedAids.size){const refs=new Set(),sc=s=>{if(typeof s=='string')for(const m of s.matchAll(/@a:([a-z0-9]+)/g))refs.add(m[1])};
  pg.forEach(p=>sc(p.json));hist.forEach(sc);A.forEach(a=>refs.add(a[0]));gcIds=[...savedAids].filter(id=>!refs.has(id))}
 const rec=p=>({uid:p.uid,json:p.json,w:p.w,h:p.h,th:p.th,name:p.name});
 const ok=await new Promise(res=>{
  if(!d){mem.proj.set(pid,meta);W.forEach(x=>mem.page.set(pid+'/'+x[0].uid,rec(x[0])));A.forEach(a=>mem.asset.set(pid+'/'+a[0],a[1].url));del.forEach(u=>mem.page.delete(pid+'/'+u));gcIds.forEach(id=>mem.asset.delete(pid+'/'+id));return res(true)}
  try{const tx=d.transaction(['proj','page','asset'],'readwrite'),sp=tx.objectStore('page'),sa=tx.objectStore('asset');
   tx.objectStore('proj').put(meta,pid);
   W.forEach(x=>sp.put(rec(x[0]),pid+'/'+x[0].uid));
   A.forEach(a=>sa.put(a[1].url,pid+'/'+a[0]));
   del.forEach(u=>sp.delete(pid+'/'+u));
   gcIds.forEach(id=>sa.delete(pid+'/'+id));
   tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false)}catch(e){res(false)}});
 if(ok){
  if(proj.id===pid){W.forEach(x=>{x[0]._sv=x[1]});A.forEach(a=>{a[1].saved=true;savedAids.add(a[0])});
   gcIds.forEach(id=>{savedAids.delete(id);const e=assets.get(id);if(e){urlIds.delete(e.url);assets.delete(id)}});stored=new Set(order)}
  setSaved('Salvo');trimAssets();notify();
  if(!d&&!warned){warned=true;toast('Armazenamento do navegador indisponível: o projeto só fica na memória desta aba.')}
 }else{setSaved('Não salvo');if(!warned){warned=true;toast('Não foi possível salvar (armazenamento cheio ou bloqueado).')}}
}
window.persist=function(){if(!proj.id||blocked)return chain;clearTimeout(pT);setSaved('Salvando…');pT=setTimeout(()=>{chain=chain.then(()=>doPersist()).catch(()=>{})},400);return chain};
window.flushNow=function(gc){clearTimeout(pT);if(!proj.id)return Promise.resolve();
 if(!lock&&!window.__ld&&!blocked){try{const p=P(),s=J();if(p.json!==s){p.json=s;dirty(p)}}catch(e){}}
 chain=chain.then(()=>doPersist(gc)).catch(()=>{});return chain};
window.save=function(){if(window.__ld)return;const p=P();
 try{const s=J(),ch=p.json!==s;if(ch){p.json=s;dirty(p)}if(ch||!p.th)thumb();
  if(ch||!p.pv){const w=canvas.getWidth();if(w){p.pv=canvas.toDataURL({format:'jpeg',quality:.88,multiplier:Math.min(2,1800/Math.max(p.w,p.h))*p.w/w});pvTouch(p)}}}catch(e){}};

/* ---------- previews sob demanda ---------- */
const pvOrder=[],vis=new Set(),pvQ=[];let pvIO=null,pvBusy=false;
function pvTouch(p){const k=pvOrder.indexOf(p);if(k>=0)pvOrder.splice(k,1);pvOrder.push(p);pvEvict()}
function pvEvict(){for(let k=0;k<pvOrder.length&&pvOrder.length>10;){const p=pvOrder[k],i=pages.indexOf(p);
  if(i<0){pvOrder.splice(k,1);continue}
  if(p===P()||vis.has(i)){k++;continue}
  p.pv=undefined;pvOrder.splice(k,1);const im=document.querySelector('img[data-i="'+i+'"]');if(im&&p.th)im.src=p.th}}
function pvNeed(i){const p=pages[i];if(!p||i===cur)return;if(p.pv){pvTouch(p);return}if(pvQ.indexOf(p)<0)pvQ.push(p);pvRun()}
async function pvRun(){if(pvBusy)return;pvBusy=true;
 try{while(pvQ.length){const p=pvQ.shift();let i=pages.indexOf(p);if(i<0||i===cur||p.pv)continue;
   await new Promise(r=>setTimeout(r,24));
   await usedFonts(p.json);
   const sc=new fabric.StaticCanvas(null,{width:p.w,height:p.h});
   if(p.json)await new Promise(r=>sc.loadFromJSON(p.json,r));else sc.backgroundColor='#fff';
   sc.renderAll();p.pv=sc.toDataURL({format:'jpeg',quality:.88,multiplier:Math.min(2,1800/Math.max(p.w,p.h))});sc.dispose();
   pvTouch(p);i=pages.indexOf(p);const im=i>=0&&document.querySelector('img[data-i="'+i+'"]');if(im&&p.pv)im.src=p.pv}}
 finally{pvBusy=false}}
function pvObserve(){if(pvIO){pvIO.disconnect();pvIO=null}vis.clear();const st=$('#stage');
 if(!('IntersectionObserver' in window)){pages.forEach((p,i)=>pvNeed(i));return}
 pvIO=new IntersectionObserver(es=>es.forEach(en=>{const i=+en.target.dataset.i;if(en.isIntersecting){vis.add(i);pvNeed(i)}else vis.delete(i)}),{root:st,rootMargin:'700px 400px'});
 st.querySelectorAll('img[data-i]').forEach(im=>pvIO.observe(im))}
window.genPvs=function(){trimAssets()};
{const _r=renderPages;window.renderPages=function(){_r.apply(this,arguments);pvObserve()}}
function trimMem(hard){trimAssets();
 if(hard){pages.forEach((p,i)=>{if(i!==cur&&p.pv){p.pv=undefined;const im=document.querySelector('img[data-i="'+i+'"]');if(im&&p.th)im.src=p.th}});pvOrder.length=0;
  if(hist.length>10&&hi===hist.length-1){hist=hist.slice(-10);hi=hist.length-1}}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){flushNow(true).then(()=>trimMem(true))}else{pvObserve();refreshHomeSoft()}});
addEventListener('pagehide',()=>{flushNow()});
setInterval(()=>{if(document.hidden)return;const m=performance&&performance.memory;if(m&&m.usedJSHeapSize>m.jsHeapSizeLimit*.7){trimMem(true);toast('Memória otimizada')}},15000);

/* ---------- projetos ---------- */
async function listProjects(){const d=await idb();let L;if(!d)L=[...mem.proj.values()];else{try{L=(await rq2(d.transaction('proj').objectStore('proj').getAll()))||[]}catch(e){L=[]}}return L.sort((a,b)=>(b.updated||0)-(a.updated||0))}
async function deleteProject(id){
 if(id===proj.id){clearTimeout(pT);proj={id:'',name:'Sem título'};resetStore();try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){}setTitle()}
 const d=await idb();
 if(!d){mem.proj.delete(id);['page','asset'].forEach(s=>[...mem[s].keys()].forEach(k=>{if(k.startsWith(id+'/'))mem[s].delete(k)}));notify();return}
 await new Promise(res=>{try{const tx=d.transaction(['proj','page','asset'],'readwrite');tx.objectStore('proj').delete(id);tx.objectStore('page').delete(rng(id));tx.objectStore('asset').delete(rng(id));tx.oncomplete=tx.onerror=tx.onabort=()=>res()}catch(e){res()}});
 notify()}
async function refreshHome(){const l=await listProjects();if($('#home').style.display!='none')renderHome(l)}
function refreshHomeSoft(){if($('#home').style.display=='none')return;const q=document.getElementById('hsq');if(q&&(q.value||document.activeElement===q))return;refreshHome()}
Object.assign(window,{listProjects,deleteProject,refreshHome});
addEventListener('focus',refreshHomeSoft);

window.openProjById=async function(id,anim){
 if(proj.id!==id&&await openElsewhere(id)){toast(OPEN_MSG);return false}
 if(proj.id&&proj.id!==id){try{await flushNow(true)}catch(e){}}
 const m=await dget('proj',id);if(!m){toast('Projeto não encontrado');return false}
 const recs=await drange('page',id),by={};recs.forEach(r=>{if(r&&r.uid)by[r.uid]=r});
 let ps=(m.order||[]).map(u=>{const r=by[u];return r?{uid:u,json:r.json,w:r.w,h:r.h,th:r.th,name:r.name,_sv:0,_v:0}:null}).filter(Boolean);
 if(!ps.length)ps=[{json:null,w:595,h:842}];
 const go=()=>{resetStore();stored=new Set(ps.map(p=>p.uid).filter(Boolean));pages=ps;cur=0;textColor=m.tc||'#000000';proj={id:id,name:m.name||'Sem título'};
  $('#pname').value=proj.name;setTitle();$('#home').style.display='none';load();hashSet(id);announce(id);initSaved(id)};
 if(anim)vt(go);else go();
 return true};
window.start=function(w,h,name,tp){
 (proj.id?flushNow(true):Promise.resolve()).catch(()=>{}).then(()=>{vt(()=>{
  resetStore();pages=[{json:null,w,h}];cur=0;textColor='#000000';proj={id:newPid(),name};
  $('#pname').value=name;setTitle();$('#home').style.display='none';load();if(tp!=null)tpl(tp);pin()})})};
window.pin=function(){hashSet(proj.id);announce(proj.id);setTitle();persist()};
window.undoImport=function(prev){proj=prev;resetStore();stored=new Set(pages.map(uidOf));initSaved(proj.id)};
window.showHome=async function(){
 try{if(proj.id)await flushNow(true)}catch(e){}
 const l=await listProjects();
 vt(()=>{fly='';$('#fly').classList.remove('open');renderHome(l);$('#home').style.display='block'})};
$('#homebtn').onclick=()=>showHome();
$('#pname').addEventListener('input',()=>{setTitle()});

/* cada projeto numa aba própria */
window.openNew=function(hash,fb){
 let embedded=false;try{embedded=window.top!==window.self}catch(e){embedded=true}
 if(!embedded&&/^(https?|file):$/.test(location.protocol)){
  let w=null;try{w=window.open(location.href.split('#')[0]+'#'+hash,'_blank')}catch(e){}
  if(w){try{w.opener=null}catch(e){}return}}
 fb()};

/* o mesmo projeto aberto em duas abas: oferece uma cópia, para ninguém sobrescrever o outro */
const OPEN_MSG='Este projeto já está aberto em outra aba. Feche a outra aba ou use ela para editar.';
if(BC)BC.onmessage=e=>{const m=e.data||{};
 if(m.t=='ask'&&proj.id&&m.id===proj.id&&m.tab!==TAB&&!blocked)BC.postMessage({t:'yes',id:m.id,to:m.tab,rid:m.rid});
 else if(m.t=='has'&&proj.id&&m.id===proj.id&&m.tab!==TAB&&!blocked)BC.postMessage({t:'dup',id:m.id,to:m.tab});
 else if(m.t=='dup'&&m.to===TAB&&m.id===proj.id)leaveDup();
 else if(m.t=='list')refreshHomeSoft()};
/* alguma outra aba está com este projeto aberto? */
function openElsewhere(id){return new Promise(res=>{if(!BC)return res(false);const rid=Math.random().toString(36).slice(2);let done=false;
 const h=e=>{const m=e.data||{};if(m.t=='yes'&&m.to===TAB&&m.rid===rid&&!done){done=true;BC.removeEventListener('message',h);res(true)}};
 BC.addEventListener('message',h);
 try{BC.postMessage({t:'ask',id,tab:TAB,rid})}catch(e){}
 setTimeout(()=>{if(!done){done=true;BC.removeEventListener('message',h);res(false)}},300)})}
/* corrida rara (duas abas abriram juntas): esta aba sai do projeto sem salvar nada */
function leaveDup(){blocked=true;clearTimeout(pT);proj={id:'',name:'Sem título'};resetStore();blocked=false;
 try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){}setTitle();toast(OPEN_MSG);showHome()}
window.openIfFree=async function(id){
 if(await openElsewhere(id)){toast(OPEN_MSG);return}
 openNew('p-'+id,()=>openProjById(id,true))};

/* ---------- migração do formato antigo (localStorage) ---------- */
async function migrate(){
 let raw=null;try{raw=localStorage.getItem('pdfstudio:list')}catch(e){return}
 if(!raw)return;let L;try{L=JSON.parse(raw)}catch(e){return}
 const d=await idb();if(!d||!Array.isArray(L))return;
 let all=true;
 for(let k=0;k<L.length;k++){const p=L[k];
  try{const pid=String(p.id);if(await dget('proj',pid))continue;
   const urls=new Map(),A={};let n=0;
   const ex=s=>typeof s=='string'?s.replace(/"src":"(data:[^"]+)"/g,(m,u)=>{let id=urls.get(u);if(!id){id=newAid();urls.set(u,id);A[id]=u}return'"src":"@a:'+id+'"'}):s;
   const order=[],pgs=[];
   (p.pages||[]).forEach(pg=>{const uid=Math.random().toString(36).slice(2,9)+(++n).toString(36);order.push(uid);pgs.push({uid,json:ex(pg.json),w:pg.w,h:pg.h,th:pg.th,name:pg.name})});
   await new Promise(res=>{try{const tx=d.transaction(['proj','page','asset'],'readwrite');
    tx.objectStore('proj').put({id:pid,name:p.name||'Sem título',tc:p.tc||'#000000',updated:Date.now()-k*1000,order,np:order.length,th:(pgs[0]&&pgs[0].th)||''},pid);
    pgs.forEach(r=>tx.objectStore('page').put(r,pid+'/'+r.uid));
    Object.keys(A).forEach(id=>tx.objectStore('asset').put(A[id],pid+'/'+id));
    tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>res()}catch(e){res()}});
   if(!(await dget('proj',pid)))all=false}catch(e){all=false}}
 if(all){try{localStorage.removeItem('pdfstudio:list')}catch(e){}}}

/* ---------- bibliotecas pesadas só quando usadas ---------- */
const loadScript=u=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=()=>res();s.onerror=()=>rej(new Error('lib'));document.head.appendChild(s)});
let pjP=null,jpP=null;
window.needPdfjs=()=>pjP||(pjP=loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js').then(()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}).catch(e=>{pjP=null;throw e}));

/* ---------- imagens: reduz fotos enormes ao enviar ---------- */
function readImg(f,max){max=max||2400;
 return new Promise((res,rej)=>{
  const fr=new FileReader(),raw=()=>{fr.onload=()=>res(fr.result);fr.onerror=()=>rej(new Error('read'));fr.readAsDataURL(f)};
  if(!/^image\/(png|jpe?g|webp|bmp)$/i.test(f.type)||f.size<350000)return raw();
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{try{const w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));
    if(k>=1&&f.size<1500000){URL.revokeObjectURL(url);return raw()}
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
    const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);
    const png=/png|webp/i.test(f.type),u=png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.9);
    c.width=c.height=0;URL.revokeObjectURL(url);res(u)}catch(e){URL.revokeObjectURL(url);raw()}};
  im.onerror=()=>{URL.revokeObjectURL(url);raw()};im.src=url})}
function mkThumb(u){return new Promise(res=>{const im=new Image();im.onload=()=>{try{const k=Math.min(1,240/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);const t=c.toDataURL('image/jpeg',.75);c.width=c.height=0;res(t)}catch(e){res(u)}};im.onerror=()=>res(u);im.src=u})}
const upT=[];
PANELS.up=()=>`<h3>Uploads</h3><button class="prim" data-a="upl" style="width:100%;min-height:46px;border-radius:12px">${ic('plus')} Enviar imagem</button><h4>Enviadas nesta sessão</h4><div class="grid g2">${ups.map((u,i)=>`<button data-a="upimg" data-v="${i}" style="padding:0;overflow:hidden;aspect-ratio:1;min-height:0"><img src="${upT[i]||u}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover"></button>`).join('')||'<span style="color:var(--mut)">Nenhuma ainda.</span>'}</div>`;
$('#fimg').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let u;
 try{u=await readImg(f)}catch(er){toast('Não foi possível abrir a imagem');return}
 const t=upPg;upPg=-1;if(t>=0&&t!==cur&&t<pages.length)goThen(t,()=>addImg(u));else addImg(u);
 const th=await mkThumb(u);ups.unshift(u);upT.unshift(th);ups.splice(8);upT.splice(8);if(fly=='up')$('#fly').innerHTML=fh('up')};
$('#flogo').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{BR.logo=await readImg(f,900);sv();if(fly=='brand')$('#fly').innerHTML=fh('brand');toast('Logo salva na marca')}catch(er){toast('Não foi possível abrir a imagem')}};

/* ---------- partida ---------- */
(async()=>{
 if(/^#(p|d|t|c)-/.test(location.hash))$('#home').style.display='none';
 try{await idb();await migrate()}catch(e){}
 let ok=false;
 try{const h=location.hash.slice(1);let m;
  if(m=h.match(/^d-(\d+)$/)){const t=TYPES[m[1]];if(t){start(t[1],t[2],t[0]+' sem título',t[4]);ok=true}}
  else if(m=h.match(/^t-(\d+)$/)){if(TP[m[1]]){start(595,842,TP[m[1]][0],+m[1]);ok=true}}
  else if(m=h.match(/^c-(\d+)-(\d+)$/)){start(+m[1],+m[2],'Design personalizado');ok=true}
  else if(m=h.match(/^p-([A-Za-z0-9_]+)$/)){ok=await openProjById(m[1],false)}
 }catch(e){}
 if(!ok)showHome();
})();
})();
