<script type="module">

import {getStorage,ref,uploadBytes,getDownloadURL,deleteObject} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-storage.js";

const app=initializeApp({apiKey:"AIzaSyBownWEMVI3hOipdVJCML_1_nTY7FLJgJQ",authDomain:"calculodasnotas.firebaseapp.com",projectId:"calculodasnotas",storageBucket:"calculodasnotas.firebasestorage.app",messagingSenderId:"882266006008",appId:"1:882266006008:web:cba9b3a4ae50e48645f60d"});
const auth=getAuth(app),db=getFirestore(app),st=getStorage(app);
const ADMIN="zarthur063@gmail.com";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ms=t=>{if(!t)return 0;if(typeof t==="number")return t;if(t.toMillis)return t.toMillis();if(typeof t==="string"){const n=Date.parse(t);return isNaN(n)?0:n}return 0};
const when=o=>{for(const k of["criadoEm","criadoEmMs","createdAt","em","ts","desde"]){const v=ms(o&&o[k]);if(v)return v}return 0};
const ago=t=>{t=ms(t);if(!t)return"—";const s=(Date.now()-t)/1e3;return s<60?"agora":s<3600?Math.floor(s/60)+" min":s<86400?Math.floor(s/3600)+" h":s<2592e3?Math.floor(s/86400)+" d":dt(t)};
const dt=t=>ms(t)?new Date(ms(t)).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"}).replace(/\./g,""):"—";
const full=t=>ms(t)?new Date(ms(t)).toLocaleString("pt-BR",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}).replace(/\./g,""):"—";
const kb=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(2)+" MB";
const dd=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}/.test(v)?v.slice(8,10)+"/"+v.slice(5,7)+"/"+v.slice(0,4):dt(v);
const nf=n=>String(n).replace(".",",");
let tt;const toast=(m,e)=>{const t=$("#toast");t.textContent=m;t.className=e?"err":"";t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)};
const fail=e=>toast(e&&e.code==="permission-denied"?"Sem permissão (regras do Firestore)":(e&&e.message)||"Erro",1);
const ask=(msg,ok="Confirmar",danger=1)=>new Promise(res=>{const d=$("#dlg");d.innerHTML=`<p>${esc(msg).replace(/\n/g,"<br>")}</p><div class="acts"><button class="sec" value="n">Cancelar</button><button class="${danger?"dng":"pri"}" value="y">${ok}</button></div>`;d.onclick=e=>{const b=e.target.closest("button");if(b){d.close();res(b.value==="y")}};d.oncancel=()=>res(false);d.showModal()});
const IC={search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',link:'<svg class="lk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',clock:'<svg class="lk w" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 t:{u:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>',a:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',h:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',c:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',w:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>',d:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.7-4 3-9 3s-9-1.3-9-3M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/></svg>',b:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>'}};

const S={users:[],fr:[],rq:[],un:[],gr:[],ad:{},rel:[],pop:[],not:[],ban:[],bip:[],bdv:[],loaded:false,at:0};
const UI={v:"home",q:"",f:"all",sort:"joined",fr:"reqs",uq:"",rqf:"all",nt:"pop",rf:"new",rq2:"",day:1,su:null,stab:"perfil",bt:"acc"};
const TITLES={home:"Resumo",users:"Usuários",friends:"Social",notices:"Avisos",reports:"Relatos",sched:"Horário padrão",bans:"Banidos"};
const U=uid=>S.users.find(x=>x.uid===uid);
const nameOf=uid=>{const u=U(uid);return u?u.nome:"Usuário removido"};
const COLORS=["#0A84FF","#32D74B","#FF9F0A","#BF5AF2","#FF453A","#64D2FF","#FFD60A"];
const colorOf=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return COLORS[Math.abs(h)%COLORS.length]};
window.__avErr=i=>{const n=(i.dataset.alt||"").split(" ").filter(Boolean);if(n.length){i.dataset.alt=n.slice(1).join(" ");i.src=n[0]}else i.remove()};
const photoList=u=>[...new Set([...(u.fotos||[]),u.foto].filter(x=>typeof x==="string"&&/^https:\/\//.test(x)).map(x=>x.replace(/=s\d+(-c)?$/,"=s160-c")))];
const avatar=(u,sz="")=>{u=u||{nome:"?",uid:"x"};const c=u.color||colorOf(u.uid),f=photoList(u);return `<div class="av ${sz}" style="background:${c}2e;color:${c}">${esc((u.nome||"?").trim()[0]||"?").toUpperCase()}${f.length?`<img src="${esc(f[0])}" data-alt="${esc(f.slice(1).join(" "))}" referrerpolicy="no-referrer" loading="lazy" decoding="async" alt="" onerror="__avErr(this)">`:""}</div>`};

/* ───── tema (mesma preferência do site principal) ───── */
const ICT={sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'};
const getTheme=()=>{try{return localStorage.getItem("t205_theme")||"system"}catch(_){return"system"}};
const effTheme=t=>t==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;
function applyTheme(t){const e=effTheme(t);document.documentElement.dataset.theme=e;document.querySelector('meta[name=theme-color]').content=e==="dark"?"#000000":"#FAFAFC";$("#theme").innerHTML=e==="dark"?ICT.sun:ICT.moon}
$("#theme").onclick=()=>{const n=effTheme(getTheme())==="dark"?"light":"dark";try{localStorage.setItem("t205_theme",n)}catch(_){}applyTheme(n)};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>getTheme()==="system"&&applyTheme("system"));
applyTheme(getTheme());

/* ───── acesso ───── */
onAuthStateChanged(auth,u=>{
 if(u&&u.email===ADMIN&&u.emailVerified){$("#gate").hidden=true;$("#app").hidden=false;start()}
 else{$("#app").hidden=true;$("#gate").hidden=false;$("#gate").innerHTML="<h1>Acesso restrito</h1><span>Entre com a conta de administrador no site principal e volte aqui.</span>"}
});
$("#logout").onclick=()=>signOut(auth);
$("#refresh").onclick=()=>load(true);
let started=false;
function start(){
 if(started)return;started=true;load();
 const live=(c,key,fn)=>onSnapshot(query(collection(db,c),orderBy("criadoEm","desc")),s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));fn&&fn();render(1)},fail);
 live("relatos_erro","rel",()=>{const n=S.rel.filter(r=>!r.lido).length,d=$("#dot");d.hidden=!n;d.textContent=n});
 live("avisos_popup","pop");live("notificacoes_admin","not");loadSched();
 live("banimentos","ban",()=>{if(UI.su&&UI.stab!=="editar")renderSheet()});live("banimentos_ip","bip");live("banimentos_aparelho","bdv");
}
async function load(manual){
 const b=$("#refresh");b.classList.add("spin");
 const names=["users","amizades","solicitacoes_amizade","usernames","amizades_dados","grupos"];
 const res=await Promise.all(names.map(c=>getDocs(collection(db,c)).catch(e=>{fail(e);return{docs:[]}})));
 S.ad={};res[4].docs.forEach(d=>S.ad[d.id]=d.data());
 const unf={};res[3].docs.forEach(d=>{const v=d.data();if(v.uid&&v.foto)unf[v.uid]=v.foto});
 S.users=res[0].docs.map(d=>{const x=d.data(),s=x.student||{},a=S.ad[d.id]||{};
  const joined=ms(s.memberSince)||ms(x.createdAt)||ms(a.desde)||0; // "Entrou na plataforma" = data de criação da conta
  return{uid:d.id,raw:x,nome:s.nome||a.nome||"(sem nome)",email:x.email||a.email||"",escola:s.escola||a.escola||"",turma:s.turma||a.turma||"",serie:s.serie||"",user:s.username||a.username||"",bio:s.bio||a.bio||"",foto:"",fotos:[s.googlePhoto,a.foto,unf[d.id],x.photoURL,x.foto,x.fotoUrl],color:s.avatarColor||"",upd:ms(x.updatedAt),login:ms(x.lastLoginAt),joined,only:x.authOnly===true,exams:countEv(x.grades),seen:ms(a.lastSeen)}});
 S.fr=res[1].docs.map(d=>({id:d.id,...d.data()}));
 S.rq=res[2].docs.map(d=>({id:d.id,...d.data()}));
 S.un=res[3].docs.map(d=>({id:d.id,...d.data()}));S.gr=res[5].docs.map(d=>({id:d.id,...d.data()}));
 S.loaded=true;S.at=Date.now();b.classList.remove("spin");render();if(UI.su)renderSheet();if(manual)toast("Dados atualizados");
}
const friendsOf=uid=>S.fr.filter(f=>(f.membros||[]).includes(uid)).map(f=>f.membros.find(m=>m!==uid));

/* ───── navegação ───── */
$("#nav").onclick=e=>{const b=e.target.closest("button[data-v]");if(!b)return;UI.v=b.dataset.v;document.querySelectorAll("nav button[data-v]").forEach(x=>x.classList.toggle("on",x===b));$("#title").textContent=TITLES[UI.v];scrollTo(0,0);$("#view").dataset.v="";render()};
const empty=t=>`<div class="empty">${t}</div>`;
const ph=q=>`<div class="search">${IC.search}<input id="${q}" placeholder="Buscar" value="${esc(UI[q])}" autocomplete="off"></div>`;
function render(soft){
 if(!started)return;
 $("#sub").textContent=S.at?"Atualizado "+ago(S.at):"Carregando…";
 if(soft&&UI.v==="sched")return;
 if(soft&&UI.v==="notices"&&$("#nlist")){const t=document.createElement("div");t.innerHTML=vNotices();$("#nlist").innerHTML=t.querySelector("#nlist").innerHTML;return}
 const v=$("#view"),a=document.activeElement;
 if(v.dataset.v===UI.v&&["notices","sched"].includes(UI.v)&&v.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
 const id=a&&v.contains(a)?a.id:"",pos=a&&a.selectionStart,y=scrollY;
 v.dataset.v=UI.v;
 v.innerHTML=!S.loaded&&["home","users","friends"].includes(UI.v)?empty("Carregando dados do Firestore…"):({home:vHome,users:vUsers,friends:vFriends,notices:vNotices,reports:vReports,sched:vSched,bans:vBans})[UI.v]();
 if(id&&$("#"+id)){const el=$("#"+id);el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}
 scrollTo(0,y);
 if(UI.v==="notices")wireNotices();if(UI.v==="sched")wireSched();
}

/* ───── resumo ───── */
const tile=(c,i,n,l,act)=>`<${act?`button data-act="go" data-k="${act}"`:"div"} class="tile ${c}"><i>${IC.t[i]}</i><b>${n}</b><span>${l}</span></${act?"button":"div"}>`;
function bars(vals,labels,color){const m=Math.max(1,...vals),w=100/vals.length;return `<svg viewBox="0 0 280 90" style="width:100%;display:block"><g>${vals.map((v,i)=>{const h=Math.max(2,v/m*62);return `<rect x="${i*20+2}" y="${70-h}" width="16" height="${h}" rx="4" fill="${color}" opacity="${v?1:.25}"/><text x="${i*20+10}" y="${66-h}" font-size="9" fill="#999" text-anchor="middle">${v||""}</text>`}).join("")}</g><text x="2" y="86" font-size="9" fill="#777">${labels[0]}</text><text x="278" y="86" font-size="9" fill="#777" text-anchor="end">${labels[1]}</text></svg>`}
function vHome(){
 const now=Date.now(),L=S.users,act=u=>Math.max(u.login,u.seen,u.upd),d7=L.filter(u=>now-act(u)<6048e5).length,d1=L.filter(u=>now-act(u)<864e5).length;
 const unread=S.rel.filter(r=>!r.lido).length,live=S.pop.filter(p=>!p.expiraEm||ms(p.expiraEm)>now).length,nI=fixList(issues()).length;
 const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-13+i);return d.getTime()});
 const cad=days.map(d=>L.filter(u=>u.joined>=d&&u.joined<d+864e5).length);
 const recent=[...L].sort((a,b)=>act(b)-act(a)).slice(0,5);
 const att=[];
 if(unread)att.push(["reports",unread+" relato"+(unread>1?"s":"")+" de erro não lido"+(unread>1?"s":""),"r","Ver"]);
 if(nI)att.push(["friends:fix",nI+" registro"+(nI>1?"s":"")+" quebrado"+(nI>1?"s":"")+" para limpar","a","Corrigir"]);
 const old=S.rq.filter(r=>when(r)&&now-when(r)>6048e5).length;
 if(old)att.push(["friends:reqs",old+" pedido"+(old>1?"s":"")+" de amizade parado"+(old>1?"s":"")+" há +7 dias","a","Ver"]);
 return `<h2 style="margin-top:4px">Precisa de atenção</h2><div class="group">${att.length?att.map(a=>`<button class="row" data-act="go" data-k="${a[0]}"><div class="mid"><b><span>${a[1]}</span></b></div><span class="tag ${a[2]}">${a[3]}</span></button>`).join(""):'<div class="row p"><div class="mid"><b><span>Tudo em ordem</span><span class="tag g">ok</span></b></div></div>'}</div>
 <h2>Números</h2><div class="tiles">${tile("","u",L.length,"Usuários","users")}${tile("g","a",d1,"Ativos em 24 h")}${tile("","c",d7,"Ativos em 7 dias")}${tile("v","h",S.fr.length,"Amizades")}${tile("a","c",S.rq.length,"Pedidos pendentes","friends:reqs")}${tile("","u",S.gr.length,"Grupos","friends:groups")}${tile(unread?"r":"","w",unread,"Relatos novos","reports")}${tile("","b",live,"Popups no ar","notices")}</div>
 <h2>Novas contas · 14 dias <em>${cad.reduce((a,b)=>a+b,0)} no período</em></h2><div class="group" style="padding:14px">${bars(cad,[new Date(days[0]).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}),"hoje"],"#0A84FF")}</div>
 <h2>Últimos acessos</h2><div class="group">${recent.map(userRow).join("")||empty("Nenhum usuário.")}</div>`;
}

/* ───── usuários ───── */
function userRow(u){return `<button class="row" data-act="user" data-id="${u.uid}">${avatar(u)}<div class="mid"><b><span>${esc(u.nome)}</span>${u.user?`<span class="tag b">@${esc(u.user)}</span>`:""}${u.only?'<span class="tag">só login</span>':""}${banOn(banOf(u.uid))?'<span class="tag r">banido</span>':""}</b><small>${esc(u.email||u.uid)}${u.escola?" · "+esc(u.escola):""}</small></div><div class="end">${ago(u.login||u.upd)}<br>entrou ${dt(u.joined)}</div></button>`}
function vUsers(){
 const q=UI.q.toLowerCase(),now=Date.now();
 let L=S.users.filter(u=>!q||[u.nome,u.email,u.escola,u.turma,u.user,u.uid].some(x=>String(x).toLowerCase().includes(q)));
 if(UI.f==="data")L=L.filter(u=>!u.only);if(UI.f==="only")L=L.filter(u=>u.only);if(UI.f==="7d")L=L.filter(u=>now-u.upd<6048e5);if(UI.f==="un")L=L.filter(u=>u.user);if(UI.f==="ban")L=L.filter(u=>banOn(banOf(u.uid)));
 const key={joined:u=>-u.joined,upd:u=>-u.upd,login:u=>-u.login,nome:u=>u.nome.toLowerCase()}[UI.sort];
 L.sort((a,b)=>key(a)>key(b)?1:key(a)<key(b)?-1:0);

 if(t==="acc")body=`<div class="group">${S.ban.length?S.ban.map(b=>{const u=U(b.id);return `<div class="pair"><div style="display:flex;gap:10px;align-items:center${u?";cursor:pointer":""}"${u?` data-act="user" data-id="${b.id}"`:""}>${avatar(u||{nome:b.nome||"?",uid:b.id},"s")}<div class="mid"><b><span>${esc(u?u.nome:b.nome||"Usuário removido")}</span>${tags(b)}${(b.ips||[]).length?'<span class="tag b">IP</span>':""}${b.aparelho?'<span class="tag b">aparelho</span>':""}</b><small>${esc(b.email||b.id)}</small></div></div><p class="note" style="margin:10px 0 0;color:var(--t2);white-space:pre-wrap;overflow-wrap:anywhere">${b.motivo?esc(b.motivo):"<i>Sem motivo informado.</i>"}</p><div class="pf"><small>Banido ${full(b.criadoEm)}${b.permanente?"":" · termina "+full(b.expiraEm)}</small><span class="acts"><button class="sec sm" data-act="banedit" data-id="${b.id}">Alterar</button><button class="pri sm" data-act="unban" data-id="${b.id}">Desbanir</button></span></div></div>`}).join(""):empty("Ninguém está banido.")}</div>`;
 else{const L=t==="ip"?S.bip:S.bdv,col=t==="ip"?"delbip":"delbdv";
  body=`<div class="group">${L.length?L.map(b=>{const u=U(b.uid);return `<div class="row p"><div class="mid"><b><span>${esc(t==="ip"?ipLabel(b.id):b.id.slice(0,8)+"…")}</span>${tags(b)}</b><small class="w">${u?"Ligado a "+esc(u.nome):"Conta removida"} · ${b.motivo?esc(b.motivo):"sem motivo"}</small><small>${full(b.criadoEm)}</small></div><button class="dng sm" data-act="${col}" data-id="${b.id}">Liberar</button></div>`}).join(""):empty(t==="ip"?"Nenhum IP bloqueado.":"Nenhum aparelho bloqueado.")}</div>`}
 return seg+`<p class="note" style="margin-top:-4px">${intro}</p>`+clean+body}

/* ───── eventos ───── */
$("#sbg").onclick=closeSheet;
addEventListener("keydown",e=>e.key==="Escape"&&UI.su&&closeSheet());
document.addEventListener("input",e=>{const i=e.target.id;if(i==="q"||i==="uq"||i==="rq2"){UI[i]=e.target.value;render()}});
document.addEventListener("change",e=>{if(e.target.id==="sort"){UI.sort=e.target.value;render()}});
const setRead=(id,v)=>updateDoc(doc(db,"relatos_erro",id),{lido:v}).catch(fail);
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id,k=b.dataset.k,I=issues();
 const set=(o,v)=>{UI[o]=v;render()};
 switch(a){
 case"user":openUser(id);break;case"close":closeSheet();break;
 case"ban":case"banedit":openBan(id);break;
 case"unban":unban(id);break;
 case"bantab":set("bt",k);break;
 case"bdur":if(BD){BD.dur=k;banSync()}break;
 case"bcancel":$("#bandlg").close();BD=null;break;
 case"bgo":saveBan();break;
 case"delbip":if(await ask("Liberar este IP?\n\nQuem usa essa conexão volta a poder entrar (se a conta não estiver banida).","Liberar"))deleteDoc(doc(db,"banimentos_ip",id)).then(()=>toast("IP liberado")).catch(fail);break;
 case"delbdv":if(await ask("Liberar este aparelho?\n\nQuem usa esse celular volta a poder entrar (se a conta não estiver banida).","Liberar"))deleteDoc(doc(db,"banimentos_aparelho",id)).then(()=>toast("Aparelho liberado")).catch(fail);break;
 case"banclean":{const j=[];[["banimentos",S.ban],["banimentos_ip",S.bip],["banimentos_aparelho",S.bdv]].forEach(([c,L])=>L.filter(b=>!banOn(b)).forEach(b=>j.push(deleteDoc(doc(db,c,b.id)))));Promise.all(j).then(()=>toast("Expirados removidos")).catch(fail);break}
 case"stab":UI.stab=k;renderSheet();break;
 case"copy":navigator.clipboard&&navigator.clipboard.writeText(b.dataset.v);toast("Copiado");break;
 case"deluser":delUser(id);break;case"csv":csv();break;
 case"go":{const[v,t]=k.split(":");if(t)UI.fr=t;document.querySelector(`nav [data-v="${v}"]`).click();break}
 case"filter":set("f",k);break;
 case"frtab":UI.uq="";set("fr",k);break;case"rqf":set("rqf",k);break;
 case"delreq":rm("solicitacoes_amizade",id,"Cancelar este pedido de amizade?","Cancelar pedido");break;
 case"delfr":rm("amizades",id,"Desfazer esta amizade para os dois?","Desfazer");break;
 case"delun":rm("usernames",id,"Liberar o @"+id+"? O aluno mantém o nome no perfil até alterar.","Liberar");break;
 case"fixreqg":bulk(I.reqGhost.map(r=>["solicitacoes_amizade",r.id]),`Remover ${I.reqGhost.length} pedido(s) de contas apagadas?`);break;
 case"fixreqd":bulk(I.reqDone.map(r=>["solicitacoes_amizade",r.id]),`Remover ${I.reqDone.length} pedido(s) já resolvidos?`);break;
 case"fixfr":bulk(I.frGhost.map(r=>["amizades",r.id]),`Remover ${I.frGhost.length} amizade(s) com conta apagada?`);break;
 case"fixun":bulk(I.unGhost.map(r=>["usernames",r.id]),`Liberar ${I.unGhost.length} @usuário(s) sem dono ou desencontrados?`);break;
 case"fixall":bulk(fixList(I),"Corrigir todos os registros quebrados?");break;
 case"fixgr":bulk(I.grGhost.map(r=>["grupos",r.id]),`Excluir ${I.grGhost.length} grupo(s) sem dono (e o chat deles)?`);break;
 case"delgr":{const g=S.gr.find(x=>x.id===id);if(await ask(`Excluir o grupo "${g?g.nome:""}" e todo o chat?\n\nIsso vale para todos os membros.`,"Excluir"))delGroup(id).then(()=>{toast("Grupo excluído");load()}).catch(fail);break}
 case"ntab":set("nt",k);break;
 case"delnot":if(await ask("Apagar esta notificação para todo mundo?","Apagar"))deleteDoc(doc(db,"notificacoes_admin",id)).then(()=>toast("Apagada")).catch(fail);break;
 case"delpop":{const p=S.pop.find(x=>x.id===id);if(await ask("Apagar este aviso para todo mundo?","Apagar"))deleteDoc(doc(db,"avisos_popup",id)).then(()=>{toast("Aviso apagado");if(p&&p.imagemPath)deleteObject(ref(st,p.imagemPath)).catch(()=>{})}).catch(fail);break}
 case"ext":{const p=S.pop.find(x=>x.id===id);updateDoc(doc(db,"avisos_popup",id),{expiraEm:Timestamp.fromMillis(ms(p.expiraEm)+864e5)}).then(()=>toast("Prorrogado em 24 h")).catch(fail);break}
 case"relf":set("rf",k);break;
 case"read":setRead(id,true);break;case"unread":setRead(id,false);break;
 case"readall":Promise.all(S.rel.filter(r=>!r.lido).map(r=>updateDoc(doc(db,"relatos_erro",r.id),{lido:true}))).then(()=>toast("Tudo marcado como lido")).catch(fail);break;
 case"delrel":if(await ask("Apagar este relato?","Apagar"))deleteDoc(doc(db,"relatos_erro",id)).then(()=>toast("Relato apagado")).catch(fail);break;
 case"hadd":H.periods.push({n:"Nova aula",s:[12,0],e:[12,50]});fit();render();break;
 case"hbrk":H.periods.push({n:"Recreio",s:[12,0],e:[12,15],break:true});fit();render();break;
 case"hdel":{const i=+b.dataset.i,p=H.periods[i];if(!p.break){const k=H.periods.slice(0,i).filter(x=>!x.break).length;for(let d=1;d<=5;d++)H.sched[d].splice(k,1)}H.periods.splice(i,1);fit();render();break}
 case"hday":set("day",+k);break;
 case"edtri":UI.ed.tri=k;renderSheet();break;
 case"edeac":UI.ed.eac=!UI.ed.eac;renderSheet();break;
 case"edevadd":{const D=UI.ed,g=D.g[D.sub]=D.g[D.sub]||{};(g[edKey(D)]=g[edKey(D)]||[]).push({name:"",got:"",total:""});renderSheet();break}
 case"edevdel":{const D=UI.ed;D.g[D.sub][edKey(D)].splice(+b.dataset.i,1);renderSheet();break}
 case"edgdel":{const D=UI.ed;(b.dataset.n==="rem"?D.rem:D.nt).splice(+b.dataset.i,1);renderSheet();break}
 case"edsave":saveEdit();break;
 case"eddiscard":UI.ed=null;renderSheet();break;
 case"hcopy":for(let d=1;d<=5;d++)H.sched[d]=[...H.sched[UI.day]];toast("Copiado para todos os dias");break;
 case"hreload":H.ok=false;render();loadSched();break;
 }
});
</script>
