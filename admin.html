<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · Cálculo das notas</title>
<style>
:root{--bg:#0d0e12;--s1:#16181e;--s2:#1e2128;--s3:#272a33;--ln:#2a2d37;--t1:#f3f4f7;--t2:#b4b7c2;--t3:#7f8391;--ac:#FFD60A;--acbg:rgba(255,214,10,.1);--red:#ff5a5f;--green:#34c77b;--blue:#5aa9ff;--r:14px;--rs:9px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t1);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
#gate{min-height:100vh;display:grid;place-content:center;text-align:center;gap:8px;padding:24px;color:var(--t3)}
#gate h1{color:var(--t1);margin:0;font-size:20px}
#app{display:flex;min-height:100vh}
nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;background:var(--s1);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--t3);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:6px 0;border-radius:var(--rs);position:relative}
nav button svg{width:21px;height:21px}
nav button.on{color:var(--ac)}
nav .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-content:center;padding:0 4px}
.brand{display:none}
main{flex:1;min-width:0;max-width:880px;margin:0 auto;padding:14px 14px 96px}
header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
header h1{font-size:22px;margin:0;flex:1;letter-spacing:-.01em}
.ib{background:var(--s2);border:1px solid var(--ln);border-radius:var(--rs);height:38px;padding:0 12px;cursor:pointer;color:var(--t2)}
.ib:active{background:var(--s3)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.stat span{color:var(--t3);font-size:12.5px}
.stat.hot b{color:var(--ac)}
h2{font-size:13px;color:var(--t3);font-weight:600;margin:20px 2px 8px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r)}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--ln);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row.p{cursor:default}
.av{width:38px;height:38px;border-radius:50%;background:var(--s3);display:grid;place-content:center;font-weight:700;color:var(--ac);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.mid{flex:1;min-width:0}
.mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{display:block;color:var(--t3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .wrap{white-space:normal;overflow:visible}
.end{color:var(--t3);font-size:12px;flex:none;text-align:right}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--s3);color:var(--t2);margin-left:6px;font-weight:500}
.tag.g{background:rgba(52,199,123,.14);color:var(--green)}
.tag.y{background:var(--acbg);color:var(--ac)}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
input,select,textarea{background:var(--s2);border:1px solid var(--ln);border-radius:var(--rs);padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{min-height:96px;resize:vertical}
.tools input{flex:1;min-width:160px;width:auto}
.tools select{width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;background:var(--s2);border:1px solid var(--ln);border-radius:99px;padding:6px 14px;color:var(--t2);cursor:pointer;font-size:13.5px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#111;font-weight:600}
.form{padding:14px;display:grid;gap:10px}
label{font-size:12.5px;color:var(--t3);display:grid;gap:5px}
.pri{background:var(--ac);color:#111;border:0;border-radius:var(--rs);padding:12px;font-weight:700;cursor:pointer}
.pri:disabled{opacity:.5}
.sec{background:var(--s2);border:1px solid var(--ln);border-radius:var(--rs);padding:8px 12px;cursor:pointer;color:var(--t1)}
.dng{background:rgba(255,90,95,.12);border:1px solid rgba(255,90,95,.35);color:var(--red);border-radius:var(--rs);padding:8px 12px;cursor:pointer}
.empty{padding:28px 14px;text-align:center;color:var(--t3)}
.note{font-size:12.5px;color:var(--t3);margin:6px 2px}
#sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
#sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--s1);border-radius:20px 20px 0 0;border:1px solid var(--ln);padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13.5px;margin:14px 0}
.kv dt{color:var(--t3)}.kv dd{margin:0;word-break:break-word}
pre{background:var(--s2);border-radius:var(--rs);padding:10px;font-size:11.5px;overflow:auto;max-height:260px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.hp{display:grid;grid-template-columns:1fr 84px 84px auto auto;gap:6px;padding:8px 10px;border-bottom:1px solid var(--ln);align-items:center}
.hp input{padding:7px 8px}.hp label{flex-direction:row;display:flex;gap:4px;align-items:center;white-space:nowrap}
.hp label input{width:auto}
.hs{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:8px 10px;border-bottom:1px solid var(--ln);align-items:center}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--s3);border:1px solid var(--ln);padding:10px 16px;border-radius:99px;z-index:50;font-size:13.5px;max-width:90vw}
#toast.err{background:#3a1c1e;border-color:var(--red)}
@media(min-width:820px){
 nav{position:sticky;top:0;height:100vh;flex-direction:column;width:200px;border-top:0;border-right:1px solid var(--ln);padding:20px 10px;gap:4px;flex:none}
 nav button{flex-direction:row;font-size:14px;gap:12px;padding:11px 12px;justify-content:flex-start}
 nav .dot{position:static;margin-left:auto}
 .brand{display:block;font-weight:700;padding:0 12px 18px;font-size:16px}
 .grid{grid-template-columns:repeat(3,1fr)}
 main{padding-bottom:40px}
 #toast{bottom:24px}
}
@media(prefers-reduced-motion:no-preference){#sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}
</style>
</head>
<body>
<div id="gate"><h1>Verificando acesso…</h1><span id="gate-msg">Usando a sessão Google do app principal.</span></div>

<div id="app" hidden>
<nav id="nav">
 <div class="brand">Cálculo das notas<br><small style="color:var(--t3);font-weight:400">Admin</small></div>
 <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Resumo</button>
 <button data-v="users"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Usuários</button>
 <button data-v="friends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>Amizades</button>
 <button data-v="notices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>Avisos</button>
 <button data-v="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h0"/></svg>Relatos<span class="dot" id="dot" hidden></span></button>
 <button data-v="sched"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Horários</button>
</nav>
<main>
 <header><h1 id="title">Resumo</h1><button class="ib" id="refresh" title="Atualizar">Atualizar</button><button class="ib" id="logout">Sair</button></header>
 <div id="view"></div>
</main>
</div>
<div id="sheet-bg" hidden></div><div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,getDoc,setDoc,deleteDoc,addDoc,updateDoc,query,orderBy,onSnapshot,serverTimestamp,Timestamp} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL,deleteObject} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-storage.js";

const app=initializeApp({apiKey:"AIzaSyBownWEMVI3hOipdVJCML_1_nTY7FLJgJQ",authDomain:"calculodasnotas.firebaseapp.com",projectId:"calculodasnotas",storageBucket:"calculodasnotas.firebasestorage.app",messagingSenderId:"882266006008",appId:"1:882266006008:web:cba9b3a4ae50e48645f60d"});
const auth=getAuth(app),db=getFirestore(app),st=getStorage(app);
const ADMIN="zarthur063@gmail.com";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ms=t=>!t?0:typeof t==="number"?t:t.toMillis?t.toMillis():0;
const ago=t=>{t=ms(t);if(!t)return"—";const s=(Date.now()-t)/1e3;return s<60?"agora":s<3600?Math.floor(s/60)+" min":s<86400?Math.floor(s/3600)+" h":s<2592e3?Math.floor(s/86400)+" d":new Date(t).toLocaleDateString("pt-BR")};
const full=t=>ms(t)?new Date(ms(t)).toLocaleString("pt-BR"):"—";
const kb=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(2)+" MB";
let tt;const toast=(m,e)=>{const t=$("#toast");t.textContent=m;t.className=e?"err":"";t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)};
const fail=(e)=>toast((e.code==="permission-denied"?"Sem permissão (regras do Firestore)":e.message||"Erro"),1);

const S={users:[],fr:[],rq:[],un:[],rel:[],pop:[],not:[]};
const UI={v:"home",q:"",f:"all",sort:"upd",notTab:"pop",relF:"new",day:1,uq:""};
const TITLES={home:"Resumo",users:"Usuários",friends:"Amizades",notices:"Avisos",reports:"Relatos de erro",sched:"Horário padrão"};
const nameOf=uid=>{const u=S.users.find(x=>x.uid===uid);return u?u.nome:uid.slice(0,8)+"…"};
const emailOf=uid=>(S.users.find(x=>x.uid===uid)||{}).email||"";
const avatar=u=>`<div class="av">${u.foto?`<img src="${esc(u.foto)}" referrerpolicy="no-referrer" alt="">`:esc((u.nome||"?")[0].toUpperCase())}</div>`;

/* ───── acesso ───── */
onAuthStateChanged(auth,u=>{
 if(u&&u.email===ADMIN&&u.emailVerified){$("#gate").hidden=true;$("#app").hidden=false;start()}
 else{$("#app").hidden=true;$("#gate").hidden=false;$("#gate").innerHTML="<h1>Acesso restrito</h1><span>Entre com a conta de administrador no site principal e volte aqui.</span>"}
});
$("#logout").onclick=()=>signOut(auth);
$("#refresh").onclick=()=>load(true);

let started=false;
function start(){
 if(started)return;started=true;load();
 const live=(c,key,fn)=>onSnapshot(query(collection(db,c),orderBy("criadoEm","desc")),s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));fn&&fn();render()},fail);
 live("relatos_erro","rel",badge);live("avisos_popup","pop");live("notificacoes_admin","not");
 loadSched();
}
function badge(){const n=S.rel.filter(r=>!r.lido).length;const d=$("#dot");d.hidden=!n;d.textContent=n}

async function load(manual){
 const names=["users","amizades","solicitacoes_amizade","usernames"];
 const res=await Promise.all(names.map(c=>getDocs(collection(db,c)).catch(e=>{fail(e);return{docs:[]}})));
 S.users=res[0].docs.map(d=>{const x=d.data(),s=x.student||{};return{uid:d.id,raw:x,nome:s.nome||"(sem nome)",email:x.email||"",escola:s.escola||"",turma:s.turma||"",user:s.username||"",bio:s.bio||"",foto:s.googlePhoto||"",bytes:new Blob([JSON.stringify(x)]).size,upd:x.updatedAt||0,login:x.lastLoginAt||0,cre:x.createdAt||0,only:x.authOnly===true,exams:Array.isArray(x.exams)?x.exams.length:0}});
 S.fr=res[1].docs.map(d=>({id:d.id,...d.data()}));
 S.rq=res[2].docs.map(d=>({id:d.id,...d.data()}));
 S.un=res[3].docs.map(d=>({id:d.id,...d.data()}));
 render();if(manual)toast("Dados atualizados");
}

/* ───── navegação ───── */
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;UI.v=b.dataset.v;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));$("#title").textContent=TITLES[UI.v];render();scrollTo(0,0)};

function render(){
 if(!started)return;
 const v=$("#view"),keep=document.activeElement&&document.activeElement.id,pos=document.activeElement&&document.activeElement.selectionStart;
 if(["notices","sched"].includes(UI.v)&&v.dataset.v===UI.v&&v.contains(document.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return; // não apaga o que está sendo digitado
 v.dataset.v=UI.v;v.innerHTML=({home:vHome,users:vUsers,friends:vFriends,notices:vNotices,reports:vReports,sched:vSched})[UI.v]();
 if(keep&&$("#"+keep)){const el=$("#"+keep);el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}
 if(UI.v==="notices")wireNotices();if(UI.v==="sched")wireSched();
}
const empty=t=>`<div class="empty">${t}</div>`;

/* ───── resumo ───── */
function vHome(){
 const now=Date.now(),U=S.users,d7=U.filter(u=>now-u.upd<6048e5).length,d1=U.filter(u=>now-u.login<864e5).length;
 const tot=U.reduce((a,u)=>a+u.bytes,0),unread=S.rel.filter(r=>!r.lido).length;
 const activePop=S.pop.filter(p=>!p.expiraEm||ms(p.expiraEm)>now).length;
 const stat=(n,l,h)=>`<div class="stat${h?" hot":""}"><b>${n}</b><span>${l}</span></div>`;
 const recent=[...U].sort((a,b)=>b.login-a.login).slice(0,6);
 return `<div class="grid">${stat(U.length,"Usuários")}${stat(d1,"Entraram em 24 h",1)}${stat(d7,"Ativos em 7 dias")}${stat(U.filter(u=>u.only).length,"Só login, sem dados")}${stat(S.fr.length,"Amizades")}${stat(S.rq.length,"Pedidos pendentes")}${stat(unread,"Relatos não lidos",unread)}${stat(activePop,"Popups no ar")}${stat(kb(tot),"Armazenado")}</div>
 <h2>Entraram agora há pouco</h2><div class="card">${recent.length?recent.map(userRow).join(""):empty("Nenhum usuário carregado.")}</div>`;
}

/* ───── usuários ───── */
function userRow(u){return `<button class="row" data-act="user" data-id="${u.uid}">${avatar(u)}<div class="mid"><b>${esc(u.nome)}${u.user?`<span class="tag">@${esc(u.user)}</span>`:""}${u.only?'<span class="tag">só login</span>':""}</b><small>${esc(u.email||u.uid)}${u.escola?" · "+esc(u.escola):""}</small></div><div class="end">${ago(u.login||u.upd)}</div></button>`}
function vUsers(){
 const q=UI.q.toLowerCase(),now=Date.now();
 let L=S.users.filter(u=>!q||[u.nome,u.email,u.escola,u.turma,u.user,u.uid].some(x=>String(x).toLowerCase().includes(q)));
 if(UI.f==="data")L=L.filter(u=>!u.only);if(UI.f==="only")L=L.filter(u=>u.only);if(UI.f==="7d")L=L.filter(u=>now-u.upd<6048e5);
 const key={upd:u=>-u.upd,login:u=>-u.login,cre:u=>-u.cre,bytes:u=>-u.bytes,nome:u=>u.nome.toLowerCase()}[UI.sort];
 L.sort((a,b)=>key(a)>key(b)?1:-1);
 const chip=(k,l)=>`<button class="chip${UI.f===k?" on":""}" data-act="filter" data-k="${k}">${l}</button>`;
 return `<div class="tools"><input id="q" placeholder="Buscar nome, e-mail, @usuário, escola ou UID" value="${esc(UI.q)}"><select id="sort"><option value="upd">Salvou por último</option><option value="login">Entrou por último</option><option value="cre">Conta mais nova</option><option value="bytes">Maior consumo</option><option value="nome">Nome</option></select></div>
 <div class="chips">${chip("all","Todos")}${chip("data","Com dados")}${chip("only","Só login")}${chip("7d","Ativos 7 dias")}</div>
 <div class="card">${L.length?L.slice(0,200).map(userRow).join(""):empty("Nenhum usuário encontrado.")}</div>${L.length>200?`<p class="note">Mostrando 200 de ${L.length}. Use a busca.</p>`:""}`;
}
async function openUser(id){
 const u=S.users.find(x=>x.uid===id);if(!u)return;
 let seen="";try{const a=await getDoc(doc(db,"amizades_dados",id));if(a.exists()&&a.data().lastSeen)seen=full(a.data().lastSeen)}catch(_){}
 const fr=S.fr.filter(f=>(f.membros||[]).includes(id)).length;
 const row=(k,v)=>`<dt>${k}</dt><dd>${v||"—"}</dd>`;
 sheet(`<div class="row p" style="padding:0;border:0">${avatar(u)}<div class="mid"><b>${esc(u.nome)}</b><small>${esc(u.email)}</small></div></div>
 <dl class="kv">${row("UID",`<span data-act="copy" data-v="${u.uid}" style="cursor:pointer">${u.uid} (copiar)</span>`)}${row("Usuário",u.user&&"@"+esc(u.user))}${row("Bio",esc(u.bio))}${row("Escola",esc(u.escola))}${row("Turma",esc(u.turma))}${row("Conta criada",full(u.cre))}${row("Último login",full(u.login))}${row("Último salvamento",full(u.upd))}${row("Visto online",seen)}${row("Provas",u.exams)}${row("Amigos",fr)}${row("Tamanho",kb(u.bytes))}</dl>
 <details><summary class="note">Ver dados brutos (somente leitura)</summary><pre>${esc(JSON.stringify(u.raw,null,1).slice(0,20000))}</pre></details>
 <p class="note">As regras do Firestore só deixam o próprio aluno alterar os dados dele. Aqui você consulta e remove.</p>
 <div class="acts" style="margin-top:12px"><button class="dng" data-act="deluser" data-id="${u.uid}">Apagar dados do usuário</button><button class="sec" data-act="close">Fechar</button></div>`);
}
async function delUser(id){
 const u=S.users.find(x=>x.uid===id);
 if(!confirm(`Apagar todos os dados de ${u.nome}?\n\nRemove notas, perfil social e @usuário. A conta de login do Google continua existindo (isso só dá pra fazer no console do Firebase).`))return;
 try{
  const jobs=[deleteDoc(doc(db,"users",id)),deleteDoc(doc(db,"amizades_dados",id))];
  if(u.email)jobs.push(deleteDoc(doc(db,"perfis_amizade",u.email.toLowerCase())));
  if(u.user)jobs.push(deleteDoc(doc(db,"usernames",u.user)));
  S.fr.filter(f=>(f.membros||[]).includes(id)).forEach(f=>jobs.push(deleteDoc(doc(db,"amizades",f.id))));
  S.rq.filter(r=>r.deUid===id||r.paraUid===id).forEach(r=>jobs.push(deleteDoc(doc(db,"solicitacoes_amizade",r.id))));
  await Promise.all(jobs);toast("Dados apagados");closeSheet();load()
 }catch(e){fail(e)}
}

/* ───── amizades ───── */
function vFriends(){
 const q=UI.uq.toLowerCase();
 const frs=S.fr.map(f=>{const [a,b]=f.membros||[];return{id:f.id,a,b,t:`${nameOf(a)} ${nameOf(b)}`}}).filter(f=>!q||f.t.toLowerCase().includes(q));
 const uns=S.un.filter(x=>!q||(x.id+" "+(x.nome||"")).toLowerCase().includes(q));
 return `<div class="tools"><input id="uq" placeholder="Buscar por nome ou @usuário" value="${esc(UI.uq)}"></div>
 <h2>Pedidos pendentes (${S.rq.length})</h2><div class="card">${S.rq.length?S.rq.map(r=>`<div class="row p"><div class="mid"><b>${esc(nameOf(r.deUid))} → ${esc(nameOf(r.paraUid))}</b><small>${ago(r.criadoEm||r.criadoEmMs)}</small></div><button class="dng" data-act="delreq" data-id="${r.id}">Remover</button></div>`).join(""):empty("Nenhum pedido pendente.")}</div>
 <h2>Amizades confirmadas (${frs.length})</h2><div class="card">${frs.length?frs.map(f=>`<div class="row p"><div class="mid"><b>${esc(nameOf(f.a))} e ${esc(nameOf(f.b))}</b><small>${esc(emailOf(f.a))} · ${esc(emailOf(f.b))}</small></div><button class="dng" data-act="delfr" data-id="${f.id}">Desfazer</button></div>`).join(""):empty("Nenhuma amizade.")}</div>
 <h2>Nomes de usuário (${uns.length})</h2><div class="card">${uns.length?uns.map(x=>`<div class="row p"><div class="mid"><b>@${esc(x.id)}</b><small>${esc(x.nome||nameOf(x.uid))}</small></div><button class="dng" data-act="delun" data-id="${esc(x.id)}">Liberar</button></div>`).join(""):empty("Nenhum @usuário.")}</div>
 <p class="note">Liberar um @usuário solta o nome pra outra pessoa usar. O aluno dono dele mantém o campo no perfil até alterar.</p>`;
}
async function rm(col,id,msg){if(!confirm(msg))return;try{await deleteDoc(doc(db,col,id));toast("Removido");load()}catch(e){fail(e)}}

/* ───── avisos (popup + sino) ───── */
let popFile=null;
function vNotices(){
 const now=Date.now(),t=UI.notTab;
 const tabs=`<div class="chips"><button class="chip${t==="pop"?" on":""}" data-act="ntab" data-k="pop">Popup (${S.pop.length})</button><button class="chip${t==="bell"?" on":""}" data-act="ntab" data-k="bell">Sino (${S.not.length})</button></div>`;
 if(t==="bell")return tabs+`<div class="card form"><label>Título<input id="n-t" maxlength="80" placeholder="Ex.: Manutenção programada"></label><label>Mensagem<textarea id="n-b" maxlength="400"></textarea></label><button class="pri" id="n-go">Enviar notificação</button></div>
 <h2>Enviadas</h2><div class="card">${S.not.length?S.not.map(n=>`<div class="row p"><div class="mid"><b>${esc(n.titulo)}</b><small class="wrap">${esc(n.corpo||"")}</small><small>${ago(n.criadoEm)}</small></div><button class="dng" data-act="delnot" data-id="${n.id}">Apagar</button></div>`).join(""):empty("Nada enviado ainda.")}</div>`;
 return tabs+`<div class="card form"><label>Texto<textarea id="p-t" maxlength="600" placeholder="Aviso em banner para quem abrir o app"></textarea></label><label>Imagem (opcional)<input id="p-i" type="file" accept="image/*"></label><label>Link (opcional)<input id="p-l" placeholder="https://"></label><label>Texto do botão<input id="p-ll" placeholder="Ver mais"></label>
 <label>Some sozinho<select id="p-e"><option value="0">Nunca</option><option value="1">Em 1 hora</option><option value="6">Em 6 horas</option><option value="24">Em 24 horas</option><option value="72">Em 3 dias</option><option value="168">Em 7 dias</option></select></label><button class="pri" id="p-go">Enviar aviso</button></div>
 <h2>No ar e histórico</h2><div class="card">${S.pop.length?S.pop.map(p=>{const exp=ms(p.expiraEm),dead=exp&&exp<=now;return `<div class="row p"><div class="mid"><b>${esc(p.texto||"(só imagem)")}${p.imagemUrl?'<span class="tag">imagem</span>':""}${dead?'<span class="tag">expirado</span>':'<span class="tag g">no ar</span>'}</b><small>${ago(p.criadoEm)}${exp&&!dead?" · some em "+full(exp):""}</small></div><button class="dng" data-act="delpop" data-id="${p.id}">Apagar</button></div>`}).join(""):empty("Nenhum aviso.")}</div>`;
}
function wireNotices(){
 const g=$("#n-go");if(g)g.onclick=async()=>{const t=$("#n-t").value.trim(),b=$("#n-b").value.trim();if(!t&&!b)return toast("Escreva um título ou mensagem",1);g.disabled=true;try{await addDoc(collection(db,"notificacoes_admin"),{titulo:t||"Aviso",corpo:b||null,criadoEm:serverTimestamp()});toast("Notificação enviada");UI.notTab="bell";$("#n-t").value=$("#n-b").value=""}catch(e){fail(e)}g.disabled=false};
 const p=$("#p-go");if(p)p.onclick=async()=>{
  const texto=$("#p-t").value.trim(),f=$("#p-i").files[0],link=$("#p-l").value.trim(),ll=$("#p-ll").value.trim(),h=+$("#p-e").value;
  if(!texto&&!f)return toast("Escreva um texto ou escolha uma imagem",1);
  if(link&&!/^https?:\/\//i.test(link))return toast("O link precisa começar com http:// ou https://",1);
  p.disabled=true;p.textContent="Enviando…";
  try{let url=null,path=null;
   if(f){path=`avisos_popup/${Date.now()}_${f.name.replace(/[^\w.\-]+/g,"_")}`;const r=ref(st,path);await uploadBytes(r,f);url=await getDownloadURL(r)}
   await addDoc(collection(db,"avisos_popup"),{texto:texto||null,link:link||null,linkLabel:link?(ll||null):null,imagemUrl:url,imagemPath:path,criadoEm:serverTimestamp(),expiraEm:h?Timestamp.fromMillis(Date.now()+h*36e5):null});
   toast("Aviso enviado");$("#p-t").value=$("#p-i").value=$("#p-l").value=$("#p-ll").value=""
  }catch(e){fail(e)}p.disabled=false;p.textContent="Enviar aviso"};
}
async function delPop(id){const p=S.pop.find(x=>x.id===id);if(!confirm("Apagar este aviso para todo mundo?"))return;try{await deleteDoc(doc(db,"avisos_popup",id));if(p&&p.imagemPath)deleteObject(ref(st,p.imagemPath)).catch(()=>{});toast("Aviso apagado")}catch(e){fail(e)}}

/* ───── relatos ───── */
function vReports(){
 const L=S.rel.filter(r=>UI.relF==="all"||!r.lido);
 const chip=(k,l)=>`<button class="chip${UI.relF===k?" on":""}" data-act="relf" data-k="${k}">${l}</button>`;
 return `<div class="chips">${chip("new","Não lidos ("+S.rel.filter(r=>!r.lido).length+")")}${chip("all","Todos ("+S.rel.length+")")}</div>
 <div class="card">${L.length?L.map(r=>`<div class="row p" style="align-items:flex-start;flex-wrap:wrap"><div class="mid"><b>${esc(r.nome||"Anônimo")}${r.lido?"":'<span class="tag y">novo</span>'}</b><small>${esc(r.email||"sem e-mail")} · ${ago(r.criadoEm)}</small><p style="margin:8px 0;white-space:pre-wrap;word-break:break-word">${esc(r.mensagem)}</p><div class="acts"><button class="sec" data-act="${r.lido?"unread":"read"}" data-id="${r.id}">${r.lido?"Marcar como não lido":"Marcar como lido"}</button>${r.uid?`<button class="sec" data-act="user" data-id="${r.uid}">Ver usuário</button>`:""}<button class="dng" data-act="delrel" data-id="${r.id}">Apagar</button></div></div></div>`).join(""):empty(UI.relF==="new"?"Tudo lido. Nenhum relato novo.":"Nenhum relato enviado.")}</div>`;
}

/* ───── horário padrão ───── */
const SUBJ=[["edu_fin","Educação Financeira"],["mat","Matemática"],["bio","Biologia"],["fis","Física"],["qui","Química"],["artes","Artes Integradas"],["ed_fis","Educação Física"],["esc_cri","Escrita Criativa"],["esp","Língua Espanhola"],["ing","Língua Inglesa"],["port","Língua Portuguesa"],["lit","Literatura"],["rel","Ensino Religioso"],["geo","Geografia"],["hist","História"],["soc","Sociologia"],["proj","Proj. Integrador Mat."]];
let H={periods:[],sched:{1:[],2:[],3:[],4:[],5:[]},info:"",ok:false};
const tstr=t=>String(t[0]).padStart(2,"0")+":"+String(t[1]).padStart(2,"0");
const tparse=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s);return m?[+m[1],+m[2]]:null};
const slots=()=>H.periods.filter(p=>!p.break).length;
function fit(){for(let d=1;d<=5;d++){const c=H.sched[d]||[];H.sched[d]=Array.from({length:slots()},(_,i)=>c[i]||"mat")}}
async function loadSched(){
 try{const s=await getDoc(doc(db,"config","horarios_padrao"));
  if(s.exists()&&Array.isArray(s.data().periods)){const d=s.data();H.periods=JSON.parse(JSON.stringify(d.periods));H.sched=JSON.parse(JSON.stringify(d.sched||{}));H.info=`Última atualização: ${full(d.updatedAt)}${d.updatedByEmail?" por "+d.updatedByEmail:""}`}
  else H.info="Ainda não configurado. Adicione as aulas e salve."}catch(e){fail(e)}
 fit();H.ok=true;render();
}
function vSched(){
 if(!H.ok)return empty("Carregando…");
 const d=UI.day,days=["Seg","Ter","Qua","Qui","Sex"];let k=-1;
 return `<p class="note">Vale para todo mundo que ainda não personalizou o horário. ${esc(H.info)}</p>
 <h2>Aulas e recreios</h2><div class="card">${H.periods.length?H.periods.map((p,i)=>`<div class="hp"><input data-h="n" data-i="${i}" value="${esc(p.n)}" aria-label="Nome"><input data-h="s" data-i="${i}" value="${tstr(p.s)}" aria-label="Início" inputmode="numeric"><input data-h="e" data-i="${i}" value="${tstr(p.e)}" aria-label="Fim" inputmode="numeric"><label><input type="checkbox" data-h="b" data-i="${i}" ${p.break?"checked":""}>recreio</label><button class="dng" data-act="hdel" data-i="${i}" aria-label="Remover">✕</button></div>`).join(""):empty("Sem aulas.")}</div>
 <div class="acts" style="margin-top:8px"><button class="sec" data-act="hadd">+ Aula</button><button class="sec" data-act="hbrk">+ Recreio</button></div>
 <h2>Matérias do dia</h2><div class="chips">${days.map((n,i)=>`<button class="chip${d===i+1?" on":""}" data-act="hday" data-k="${i+1}">${n}</button>`).join("")}</div>
 <div class="card">${H.periods.map(p=>{if(p.break)return"";k++;return `<div class="hs"><span>${esc(p.n)}</span><select data-h="m" data-k="${k}">${SUBJ.map(s=>`<option value="${s[0]}"${H.sched[d][k]===s[0]?" selected":""}>${s[1]}</option>`).join("")}</select></div>`}).join("")||empty("Adicione aulas.")}</div>
 <div class="acts" style="margin-top:12px"><button class="pri" id="hsave">Salvar horário global</button><button class="sec" data-act="hreload">Descartar alterações</button></div>`;
}
function wireSched(){
 const v=$("#view");v.onchange=e=>{const t=e.target,h=t.dataset.h;if(!h)return;const i=+t.dataset.i,p=H.periods[i];
  if(h==="n")p.n=t.value;else if(h==="b"){if(t.checked)p.break=true;else delete p.break;fit();render()}
  else if(h==="s"||h==="e"){const x=tparse(t.value.trim());if(!x){toast("Use o formato 08:30",1);t.value=tstr(p[h]);return}p[h]=x}
  else if(h==="m")H.sched[UI.day][+t.dataset.k]=t.value};
 const s=$("#hsave");if(s)s.onclick=async()=>{
  if(H.periods.some(p=>!p.n.trim()))return toast("Dê um nome a cada aula",1);
  fit();s.disabled=true;
  try{await setDoc(doc(db,"config","horarios_padrao"),{periods:H.periods,sched:H.sched,updatedAt:serverTimestamp(),updatedByEmail:auth.currentUser.email});H.info="Salvo agora.";toast("Horário global salvo");render()}catch(e){fail(e)}s.disabled=false};
}

/* ───── sheet + cliques ───── */
function sheet(h){$("#sheet").innerHTML=h;$("#sheet").hidden=$("#sheet-bg").hidden=false}
function closeSheet(){$("#sheet").hidden=$("#sheet-bg").hidden=true}
$("#sheet-bg").onclick=closeSheet;
addEventListener("keydown",e=>e.key==="Escape"&&closeSheet());
document.addEventListener("input",e=>{
 if(e.target.id==="q"){UI.q=e.target.value;render()}
 if(e.target.id==="uq"){UI.uq=e.target.value;render()}
});
document.addEventListener("change",e=>{if(e.target.id==="sort"){UI.sort=e.target.value;render()}});
const setRead=(id,v)=>updateDoc(doc(db,"relatos_erro",id),{lido:v}).catch(fail);
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id,k=b.dataset.k;
 if(a==="user"){closeSheet();openUser(id)}
 else if(a==="close")closeSheet();
 else if(a==="copy"){navigator.clipboard&&navigator.clipboard.writeText(b.dataset.v);toast("UID copiado")}
 else if(a==="deluser")delUser(id);
 else if(a==="filter"){UI.f=k;render()}
 else if(a==="delreq")rm("solicitacoes_amizade",id,"Remover este pedido de amizade?");
 else if(a==="delfr")rm("amizades",id,"Desfazer esta amizade para os dois?");
 else if(a==="delun")rm("usernames",id,"Liberar o @"+id+"?");
 else if(a==="ntab"){UI.notTab=k;render()}
 else if(a==="delnot"){if(confirm("Apagar esta notificação para todo mundo?"))deleteDoc(doc(db,"notificacoes_admin",id)).then(()=>toast("Apagada")).catch(fail)}
 else if(a==="delpop")delPop(id);
 else if(a==="relf"){UI.relF=k;render()}
 else if(a==="read")setRead(id,true);else if(a==="unread")setRead(id,false);
 else if(a==="delrel"){if(confirm("Apagar este relato?"))deleteDoc(doc(db,"relatos_erro",id)).then(()=>toast("Relato apagado")).catch(fail)}
 else if(a==="hadd"){H.periods.push({n:"Nova aula",s:[12,0],e:[12,50]});fit();render()}
 else if(a==="hbrk"){H.periods.push({n:"Recreio",s:[12,0],e:[12,15],break:true});fit();render()}
 else if(a==="hdel"){H.periods.splice(+b.dataset.i,1);fit();render()}
 else if(a==="hday"){UI.day=+k;render()}
 else if(a==="hreload"){H.ok=false;render();loadSched()}
});
</script>
